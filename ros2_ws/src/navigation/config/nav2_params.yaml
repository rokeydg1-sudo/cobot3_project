# =========================================================
# AMCL
# =========================================================

amcl:
  ros__parameters:

    use_sim_time: true

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

    scan_topic: /scan

    min_particles: 500
    max_particles: 2000

    set_initial_pose: true

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0


# =========================================================
# Map Server
# =========================================================

map_server:
  ros__parameters:

    use_sim_time: true

    yaml_filename: ""


# =========================================================
# Planner Server
# =========================================================

planner_server:
  ros__parameters:

    use_sim_time: true

    expected_planner_frequency: 5.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


# =========================================================
# Controller Server
# =========================================================

controller_server:
  ros__parameters:

    use_sim_time: true

    controller_frequency: 20.0

    odom_topic: /odom

    controller_plugins:
      - FollowPath

    goal_checker_plugins:
      - general_goal_checker

    progress_checker_plugins:
      - progress_checker


    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      required_movement_radius: 0.25
      movement_time_allowance: 10.0


    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true


    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.4

      lookahead_dist: 0.6

      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9

      lookahead_time: 1.5

      transform_tolerance: 0.1

      use_velocity_scaled_lookahead_dist: false

      min_approach_linear_velocity: 0.05

      use_collision_detection: true


# =========================================================
# Global Costmap
# =========================================================

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.05

      track_unknown_space: true

      robot_radius: 0.35

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer


      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true


      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /scan

          max_obstacle_height: 2.0

          clearing: true
          marking: true

          data_type: LaserScan

          raytrace_max_range: 5.0
          obstacle_max_range: 4.0


      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.55


# =========================================================
# Local Costmap
# =========================================================

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      robot_radius: 0.35

      plugins:
        - obstacle_layer
        - inflation_layer


      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /scan

          max_obstacle_height: 2.0

          clearing: true
          marking: true

          data_type: LaserScan

          raytrace_max_range: 5.0
          obstacle_max_range: 4.0


      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.55


# =========================================================
# BT Navigator
#
# NavigateToPose Action Server를 제공
# =========================================================

bt_navigator:
  ros__parameters:

    use_sim_time: true

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    transform_tolerance: 0.1


# =========================================================
# Behavior Server
# =========================================================

behavior_server:
  ros__parameters:

    use_sim_time: true

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    transform_tolerance: 0.1